name: Fory framing comparison

on:
  push:
    branches: [ 'perf/http-buffer-handoff' ]
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Fory byte-array versus streaming comparison
        run: |
          mvn -B -ntp -pl appserver/orb/orb-http-codec-fory -am \
            -Dtest=ForyCodecBenchmarkTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dsurefire.useFile=false test | tee fory-benchmark.txt
      - name: Publish measurements
        if: always()
        run: |
          grep '^RESULT ' fory-benchmark.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fory-framing-comparison
          path: fory-benchmark.txt
